<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Expect the Unexpected</title>
        <style>
            :root {
                --color-navy: #1C2657;
                --color-virtua-blue: #3648B2;
                --color-gold: #BE933C;
                --color-teal: #3D8D89;
                --color-teal-dark: #2F6F6C;
                --color-red: #B42316;
                --color-bg: #F1F1F3;
                --color-input: #E3E6ED;
                --color-primary: #1F2224;
                --color-primary-50: #8F9091;
                --color-secondary: #5E6266;
                --font-body: "Inter", system-ui, -apple-system, sans-serif;
                --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: var(--color-bg);
                color: var(--color-primary);
                font-family: var(--font-body);
                line-height: 1.5;
            }

            header {
                background: var(--color-navy);
                color: #fff;
                padding: 2rem 1.5rem;
                border-bottom: 4px solid var(--color-gold);
            }

            header h1 {
                margin: 0;
                font-family: var(--font-display);
                font-size: 2rem;
            }

            header p {
                margin: 0.25rem 0 0;
                color: var(--color-input);
            }

            main {
                max-width: 48rem;
                margin: 2rem auto;
                padding: 0 1.5rem;
                display: grid;
                gap: 1.5rem;
            }

            section {
                background: #fff;
                border-radius: 8px;
                padding: 1.5rem;
                box-shadow: 0 1px 3px rgba(28, 38, 87, 0.12);
            }

            h2 {
                margin: 0 0 1rem;
                font-family: var(--font-display);
                font-size: 1.25rem;
                color: var(--color-navy);
            }

            code {
                color: var(--color-virtua-blue);
            }

            form {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                align-items: center;
            }

            label {
                font-weight: 600;
            }

            input[type="text"] {
                flex: 1;
                min-width: 12rem;
                padding: 0.6rem 0.75rem;
                border: 1px solid var(--color-input);
                border-radius: 6px;
                background: var(--color-bg);
                font: inherit;
            }

            input[type="text"]:focus {
                outline: 2px solid var(--color-virtua-blue);
                outline-offset: 1px;
            }

            .button {
                display: inline-block;
                padding: 0.6rem 1.25rem;
                border: none;
                border-radius: 6px;
                background: var(--color-virtua-blue);
                color: #fff;
                font: inherit;
                font-weight: 600;
                text-decoration: none;
                cursor: pointer;
            }

            .button:hover {
                background: var(--color-navy);
            }

            .result {
                margin-top: 1rem;
            }

            .result:empty {
                display: none;
            }

            .status {
                display: inline-block;
                padding: 0.2rem 0.6rem;
                border-radius: 999px;
                color: #fff;
                font-size: 0.875rem;
                font-weight: 600;
            }

            .status.success {
                background: var(--color-teal-dark);
            }

            .status.error {
                background: var(--color-red);
            }

            pre {
                margin: 0.5rem 0 0;
                padding: 0.75rem;
                border-left: 4px solid var(--color-gold);
                border-radius: 4px;
                background: var(--color-bg);
                white-space: pre-wrap;
                word-break: break-word;
            }

            pre.empty {
                color: var(--color-secondary);
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Expect the Unexpected</h1>
            <p>Exception handling demo with Jakarta EE</p>
        </header>

        <main>
            <section>
                <h2>Send a message</h2>
                <form id="send-form">
                    <label for="message">Message</label>
                    <input type="text" id="message" name="message" value="H!">
                    <button type="submit" class="button">Send</button>
                </form>
                <div id="send-result" class="result" aria-live="polite"></div>
            </section>

            <section>
                <h2>Get a message</h2>
                <a id="get-link" class="button" href="rest/messages">Get message</a>
                <div id="get-result" class="result" aria-live="polite"></div>
            </section>
        </main>

        <script>
            // Tracks the latest request per result panel so a slow, older response can't overwrite a newer one.
            const latestRequest = new WeakMap();

            async function showResponse(request, resultElement) {
                const requestId = (latestRequest.get(resultElement) ?? 0) + 1;
                latestRequest.set(resultElement, requestId);
                resultElement.replaceChildren();
                const status = document.createElement("span");
                const body = document.createElement("pre");
                try {
                    const response = await request();
                    let text = await response.text();
                    if (text && response.headers.get("Content-Type")?.includes("json")) {
                        try {
                            text = JSON.stringify(JSON.parse(text), null, 2);
                        } catch {
                            // Show the raw body if it isn't valid JSON.
                        }
                    }
                    status.className = `status ${response.ok ? "success" : "error"}`;
                    status.textContent = `HTTP ${response.status} ${response.statusText}`;
                    body.textContent = text || "(empty response body)";
                    body.classList.toggle("empty", !text);
                } catch (error) {
                    status.className = "status error";
                    status.textContent = "Request failed";
                    body.textContent = String(error);
                }
                if (latestRequest.get(resultElement) === requestId) {
                    resultElement.append(status, body);
                }
            }

            // A plain form submit can't send a raw text/plain body, so post it with fetch instead.
            document.getElementById("send-form").addEventListener("submit", (event) => {
                event.preventDefault();
                showResponse(() => fetch("rest/messages", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: document.getElementById("message").value
                }), document.getElementById("send-result"));
            });

            const getLink = document.getElementById("get-link");
            getLink.addEventListener("click", (event) => {
                event.preventDefault();
                showResponse(() => fetch(getLink.href, {
                    headers: { "Accept": "application/json" }
                }), document.getElementById("get-result"));
            });
        </script>
    </body>
</html>
